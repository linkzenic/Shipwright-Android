name: Standard Android 9.3 Release APK

on:
  push:
    branches: [android-9.3-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-standard-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.repository == 'linkzenic/Shipwright-Android'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply Android engine support
        run: |
          git -C libultraship apply --check ../CMake/patches/libultraship-android.patch
          git -C libultraship apply ../CMake/patches/libultraship-android.patch
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libzip-dev libpng-dev zlib1g-dev
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-standard-gradle-${{ runner.os }}-${{ hashFiles('Android/**/*.gradle', 'Android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-standard-gradle-${{ runner.os }}-
      - name: Install Android toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.0.10792818" "cmake;3.31.5" "platforms;android-31" "build-tools;35.0.0"
      - name: Generate matching support archive
        run: |
          cmake -S . -B build-host-tools -G Ninja -DSOH_TOOLS_ONLY=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host-tools --target GenerateSohOtr --parallel 4
          test -s build-host-tools/soh/soh.o2r
      - name: Validate generated assets and release lint before native compilation
        working-directory: Android
        run: ./gradlew :app:prepareAndroidSupportAssets :app:generateReleaseLintVitalReportModel :app:lintVitalRelease --console=plain --max-workers=4
      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/standard-release.jks"
      - name: Build standard ARM64 APK
        working-directory: Android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/standard-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: ./gradlew :app:assembleRelease --console=plain --max-workers=4
      - name: Verify update signing certificate
        run: |
          APK=$(find Android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -F 'certificate SHA-256 digest: f608b8ed8a09fd6c8890dee105f3268ad5577638ec3aa2544ff4618f399efd3e'
      - uses: actions/upload-artifact@v4
        with:
          name: SOH-9.3.0-Android
          path: Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/standard-release.jks"
