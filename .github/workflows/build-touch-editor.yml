name: Build SoH APK with touch layout editor

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout this fork (for the patch file)
        uses: actions/checkout@v4
        with:
          path: fork
      - name: Checkout Ship of Harkinian 9.3 sources
        uses: actions/checkout@v4
        with:
          repository: linkzenic/Shipwright-Android
          ref: android-9.3-integration
          submodules: recursive
          path: src
      - name: Apply Android engine support and touch layout editor
        working-directory: src
        run: |
          git -C libultraship apply --check ../CMake/patches/libultraship-android.patch
          git -C libultraship apply ../CMake/patches/libultraship-android.patch
          patch -p1 --forward < ../fork/soh-touch-layout-editor.patch
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libzip-dev libpng-dev zlib1g-dev
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.0.10792818" "cmake;3.31.5" "platforms;android-31" "build-tools;35.0.0"
      - name: Generate support archive
        working-directory: src
        run: |
          cmake -S . -B build-host-tools -G Ninja -DSOH_TOOLS_ONLY=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host-tools --target GenerateSohOtr --parallel 4
          test -s build-host-tools/soh/soh.o2r
      - name: Create a local signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/local.jks" -alias soh -keyalg RSA -keysize 2048 -validity 10000 -storepass sohlocal -keypass sohlocal -dname "CN=SoH local build"
      - name: Build APK
        working-directory: src/Android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/local.jks
          ANDROID_KEYSTORE_PASSWORD: sohlocal
          ANDROID_KEY_ALIAS: soh
          ANDROID_KEY_PASSWORD: sohlocal
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: ./gradlew :app:assembleRelease --console=plain --max-workers=4
      - uses: actions/upload-artifact@v4
        with:
          name: SOH-touch-editor-apk
          path: src/Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
          
