name: Android Fusion Fork Test APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: djvdw7f2ro/android-builder-soh:v1.0.4
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPRESS: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify latest NEI Android base
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git fetch origin sohnei-android
          if ! git merge-base --is-ancestor origin/sohnei-android HEAD; then
            echo "ERROR: Fusion Fork is missing commits from sohnei-android. Merge NEI before building."
            exit 1
          fi

      - name: Write local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > Android/local.properties
          echo "ndk.dir=${ANDROID_NDK_HOME}" >> Android/local.properties

      - name: Install host build dependencies
        run: |
          apt-get update
          apt-get install -y ccache $(cat .github/workflows/apt-deps.txt)

      - name: Restore C/C++ compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: soh-android-ccache-v1-builder-1.0.4-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt', 'soh/**', 'libultraship/**', 'Android/**') }}
          restore-keys: |
            soh-android-ccache-v1-builder-1.0.4-${{ runner.os }}-${{ github.ref_name }}-
            soh-android-ccache-v1-builder-1.0.4-${{ runner.os }}-

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          # This repository carries a legacy top-level wrapper JAR whose hash
          # is not in Gradle's public checksum catalog. It is the same checked-in
          # wrapper used by the existing successful Android builds.
          validate-wrappers: false
          cache-read-only: false

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Generate Fusion Fork soh.o2r
        run: |
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux --target GenerateSohOtr --parallel
          python3 -c 'import sys, zipfile; required={"textures/wind-waker/clouds/cloud_mae", "textures/wind-waker/clouds/cloud_naka", "textures/wind-waker/clouds/cloudtx_01", "textures/wind-waker/clouds/cloudtx_02", "textures/wind-waker/clouds/cloudtx_03"}; archive=set(zipfile.ZipFile("soh/soh.o2r").namelist()); missing=sorted(required-archive); print("Missing Sky assets: " + ", ".join(missing)) if missing else print("Verified all Sky cloud assets in soh.o2r"); sys.exit(bool(missing))'
          cp soh/soh.o2r Android/app/src/main/assets/soh.o2r
          tools/ci/inject_android_renderer_shaders.sh

      - name: Decode keystore
        run: |
          echo '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 -d > Android/app/release.jks

      - name: Build signed test APK
        env:
          GIT_TAG: v9.2.3-fusion-android.alpha.3
        run: |
          cd Android && ./gradlew assembleRelease \
            -PstoreFile=release.jks \
            -PstorePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -PkeyAlias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -PkeyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Prepare APK artifact
        run: |
          APK=$(find Android/app/build/outputs/apk/release -name 'sohfusion_release_*.apk' | head -1)
          cp "$APK" "sohfusion-v9.2.3-fusion-android.alpha.3.apk"
          sha256sum "sohfusion-v9.2.3-fusion-android.alpha.3.apk" > "sohfusion-v9.2.3-fusion-android.alpha.3.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sohfusion-test-apk
          path: |
            sohfusion-v9.2.3-fusion-android.alpha.3.apk
            sohfusion-v9.2.3-fusion-android.alpha.3.apk.sha256
          if-no-files-found: error
          retention-days: 14
