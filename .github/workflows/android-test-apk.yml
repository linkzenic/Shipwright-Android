name: Android Fusion Test APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: djvdw7f2ro/android-builder-soh:v1.0.4
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPRESS: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    permissions:
      contents: read

    steps:
      - name: Checkout Fusion
        uses: actions/checkout@v4
        with:
          ref: soh-fusion-android
          path: fusion
          fetch-depth: 0
          submodules: recursive

      - name: Verify latest NEI Android base
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}/fusion"
          git -C fusion fetch origin sohnei-android
          if ! git -C fusion merge-base --is-ancestor origin/sohnei-android HEAD; then
            echo "ERROR: Fusion Fork is missing commits from sohnei-android. Merge NEI before building."
            exit 1
          fi

      - name: Write local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > fusion/Android/local.properties
          echo "ndk.dir=${ANDROID_NDK_HOME}" >> fusion/Android/local.properties

      - name: Install host build dependencies
        run: |
          apt-get update
          apt-get install -y ccache $(cat fusion/.github/workflows/apt-deps.txt)

      - name: Restore C/C++ compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: soh-fusion-android-ccache-v1-builder-1.0.4-${{ runner.os }}-${{ hashFiles('fusion/CMakeLists.txt', 'fusion/**/CMakeLists.txt', 'fusion/soh/**', 'fusion/libultraship/**', 'fusion/Android/**') }}
          restore-keys: |
            soh-fusion-android-ccache-v1-builder-1.0.4-${{ runner.os }}-
            soh-android-ccache-v1-builder-1.0.4-${{ runner.os }}-

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          cache-read-only: false

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Generate Fusion soh.o2r
        run: |
          cmake -S fusion -B fusion/build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build fusion/build-linux --target GenerateSohOtr --parallel
          python3 -c 'import sys, zipfile; required={"textures/wind-waker/clouds/cloud_mae", "textures/wind-waker/clouds/cloud_naka", "textures/wind-waker/clouds/cloudtx_01", "textures/wind-waker/clouds/cloudtx_02", "textures/wind-waker/clouds/cloudtx_03"}; archive=set(zipfile.ZipFile("fusion/soh/soh.o2r").namelist()); missing=sorted(required-archive); print("Missing Sky assets: " + ", ".join(missing)) if missing else print("Verified all Sky cloud assets in Fusion soh.o2r"); sys.exit(bool(missing))'
          cp fusion/soh/soh.o2r fusion/Android/app/src/main/assets/soh.o2r
          cd fusion
          tools/ci/inject_android_renderer_shaders.sh

      - name: Build signed Fusion test APK
        env:
          GIT_TAG: v9.2.3-fusion-android.alpha.6
        run: |
          echo '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 -d > fusion/Android/app/release.jks
          cd fusion/Android
          ./gradlew assembleRelease \
            -PstoreFile=release.jks \
            -PstorePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -PkeyAlias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -PkeyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Prepare APK artifact
        run: |
          FUSION_APK=$(find fusion/Android/app/build/outputs/apk/release -name 'sohfusion_release_*.apk' | head -1)
          cp "$FUSION_APK" "sohfusion-test-${{ github.run_number }}.apk"
          sha256sum "sohfusion-test-${{ github.run_number }}.apk" > "sohfusion-test-${{ github.run_number }}.apk.sha256"

      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: sohfusion-test-apk
          path: |
            sohfusion-test-${{ github.run_number }}.apk
            sohfusion-test-${{ github.run_number }}.apk.sha256
          if-no-files-found: error
          retention-days: 14
