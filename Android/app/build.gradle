def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
def androidAppVersionName = "9.3.0-android.test.1"
def sohConfigFile = (project.findProperty('sohConfigFile') ?: "shipofharkinian.json").toString()
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    ndkVersion "26.0.10792818"
    namespace 'com.dishii.soh'
    compileSdkVersion 31
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        if (buildAsApplication) {
            applicationId project.findProperty('sohApplicationId') ?: "com.linkzenic.soh"
        }
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 16
        versionName androidAppVersionName
    }
    signingConfigs {
        release {
            def releaseStoreFile = project.findProperty('storeFile') ?: System.getenv('ANDROID_KEYSTORE_PATH')
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword project.findProperty('storePassword') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias project.findProperty('keyAlias') ?: System.getenv('ANDROID_KEY_ALIAS')
                keyPassword project.findProperty('keyPassword') ?: System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".localtest"
            externalNativeBuild {
                cmake {
                    arguments "-DSDL_SHARED=ON", "-DANDROID_STL=c++_static", "-DHAVE_LD_VERSION_SCRIPT=OFF",'-DUSE_OPENGLES=ON', "-DBUILD_REMOTE_CONTROL=1", "-DANDROID_APP_VERSION_NAME=${androidAppVersionName}", "-DSOH_CONFIG_FILENAME=${sohConfigFile}"
                    abiFilters 'arm64-v8a'
                }
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            externalNativeBuild {
                cmake {
                    arguments "-DSDL_SHARED=ON", "-DANDROID_STL=c++_static", "-DHAVE_LD_VERSION_SCRIPT=OFF",'-DUSE_OPENGLES=ON', "-DBUILD_REMOTE_CONTROL=1", "-DANDROID_APP_VERSION_NAME=${androidAppVersionName}", "-DSOH_CONFIG_FILENAME=${sohConfigFile}"
                    abiFilters 'arm64-v8a'
                }
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
        variant.outputs.all { output ->
            def projectName = rootProject.name
            def buildType = variant.buildType.name
            def versionName = variant.versionName
            def versionCode = variant.versionCode

            def gitTag = System.getenv("GIT_TAG") ?: "v${versionName}"
            def newApkName = "soh_${buildType}_${gitTag}.apk"
            outputFileName = newApkName
        }
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            //ndkBuild {
            //    path 'jni/Android.mk'
            //}
            cmake {
                 path '../../CMakeLists.txt'
                 version "3.31.5"
            }
        }
    }
    lintOptions {
        abortOnError false
    }
    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core:1.7.0' // Use the latest version
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}

task wrapper(type: Wrapper) {
    gradleVersion = '8.10.2'
}

tasks.register("verifyLibultrashipAndroidSupport") {
    doLast {
        def libultrashipDir = file("${rootProject.projectDir}/../libultraship")
        def contextFile = file("${libultrashipDir}/src/ship/Context.cpp")
        if (!contextFile.text.contains("sAndroidDataRootPath")) {
            throw new GradleException("The Android data-root support is missing from libultraship.")
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("configureCMake") ||
            task.name.startsWith("buildCMake") ||
            task.name.startsWith("externalNativeBuild")) {
        task.dependsOn("verifyLibultrashipAndroidSupport")
    }
}

// Use the matching Torch YAML and support archive, never the legacy XML extractor.
def supportArchive = providers.gradleProperty("sohSupportArchive").orElse("../../build-host-tools/soh/soh.o2r")
tasks.register("prepareAndroidSupportAssets", Sync) {
    into layout.buildDirectory.dir("generated/sohSupportAssets")
    from("../../soh/assets/yml") { into "assets" }
    from("src/main/assets/gamecontrollerdb.txt")
    from(provider { file(supportArchive.get()) }) { rename { "soh.o2r" } }
    doFirst {
        if (!file(supportArchive.get()).isFile()) {
            throw new GradleException("Build GenerateSohOtr with the host tools before packaging Android.")
        }
    }
}
android.sourceSets.main.assets.setSrcDirs([layout.buildDirectory.dir("generated/sohSupportAssets")])
tasks.configureEach { task ->
    if (task.name.startsWith("merge") && task.name.endsWith("Assets")) {
        task.dependsOn("prepareAndroidSupportAssets")
    }
}

task prepareKotlinBuildScriptModel {
}
